<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ობიექტი | PRIME PROPERTIES</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F9FB; --surface:#fff; --ink:#1F2D3A; --muted:#64768A;
  --sky:#DCEBF3; --sage:#5E8C7B; --sage-dark:#4C7666; --sage-soft:#E4F0EA; --gold:#B88A42; --line:#E1EAF0; --red:#C9594B;
  --serif:'Fraunces','Noto Serif Georgian',Georgia,serif;
  --sans:'Inter','Noto Sans Georgian',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.site-header{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.nav{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-family:var(--serif);font-size:1.3rem;font-weight:600}
.logo span{color:var(--gold)}
.lang{display:flex;gap:4px}
.lang button{border:1px solid var(--line);background:#fff;padding:5px 10px;border-radius:8px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--sage);border-color:var(--sage);color:#fff}

.wrap{max-width:1200px;margin:0 auto;padding:24px 24px 70px}
.back{display:inline-block;color:var(--sage);font-weight:600;margin-bottom:16px}
.back:hover{text-decoration:underline}

.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px;align-items:start}
.gal-main{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,var(--sky),var(--sage-soft));border:1px solid var(--line)}
.gal-main img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:1.2rem;cursor:pointer;color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.arrow.prev{left:12px}.arrow.next{right:12px}
.counter{position:absolute;right:12px;bottom:12px;background:rgba(31,45,58,.75);color:#fff;font-size:.78rem;padding:3px 10px;border-radius:999px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px}
.thumbs button{border:2px solid transparent;padding:0;border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:4/3;background:var(--sky)}
.thumbs button.on{border-color:var(--gold)}
.thumbs img{width:100%;height:100%;object-fit:cover}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;position:sticky;top:84px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.badge{background:var(--sage-soft);color:var(--sage);font-size:.76rem;font-weight:600;padding:4px 12px;border-radius:999px}
.badge.sold{background:var(--red);color:#fff}
.place{color:var(--muted);font-size:.9rem}
h1{font-family:var(--serif);font-size:1.7rem;line-height:1.3;margin:4px 0 14px}
.price small{display:block;color:var(--muted);font-size:.78rem}
.price strong{font-family:var(--serif);font-size:1.8rem;color:var(--gold)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.specs div span{display:block;font-size:.75rem;color:var(--muted)}
.specs div b{font-size:1rem}
.cta{display:block;text-align:center;background:var(--sage);color:#fff;padding:13px 20px;border-radius:12px;font-weight:600;transition:background .2s}
.cta:hover{background:var(--sage-dark)}
#ctaBox{display:grid;gap:10px}
.cta.wa{background:#25D366}.cta.wa:hover{background:#1EB955}

.desc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:24px}
.desc h2{font-family:var(--serif);font-size:1.25rem;margin-bottom:10px}
.desc p{white-space:pre-line;overflow-wrap:anywhere}
.amen{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.state{text-align:center;color:var(--muted);padding:80px 0}

.lightbox{position:fixed;inset:0;background:rgba(15,25,35,.92);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lightbox .x{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;font-size:1.3rem;cursor:pointer}

.avail-sum{font-weight:600;margin-bottom:12px}
.avail-sum.busy{color:var(--red)}.avail-sum.free{color:var(--sage)}
.cal-nav{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}
.cal-nav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:1.1rem}
.cal-nav button:disabled{opacity:.35;cursor:default}
.cals{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
.cal h3{font-family:var(--serif);font-size:1rem;text-align:center;margin-bottom:8px;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:.82rem}
.cal-grid .wd{color:var(--muted);font-size:.7rem;padding-bottom:2px}
.cal-grid .d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--sage-soft);color:var(--ink)}
.cal-grid .d.busy{background:var(--red);color:#fff}
.cal-grid .d.past{background:transparent;color:var(--muted);opacity:.5}
.legend{display:flex;gap:18px;margin-top:14px;font-size:.8rem;color:var(--muted)}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--sage-soft);border:1px solid var(--line);margin-right:6px;vertical-align:-1px}
.dot.busy{background:var(--red);border-color:var(--red)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.panel{position:static}}
</style>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
</head>
<body>
<header class="site-header"><div class="nav">
  <a class="logo" href="index.html"><span>PRIME</span> PROPERTIES</a>
  <div class="lang"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ka" class="on">KA</button></div>
</div></header>

<main class="wrap">
  <a class="back" id="back" href="seal.html"></a>
  <div class="state" id="state"></div>
  <div id="content" hidden>
    <div class="layout">
      <div>
        <div class="gal-main" id="galMain">
          <img id="mainImg" alt="">
          <button class="arrow prev" id="prev" type="button" aria-label="Previous">‹</button>
          <button class="arrow next" id="next" type="button" aria-label="Next">›</button>
          <span class="counter" id="counter"></span>
        </div>
        <div class="thumbs" id="thumbs"></div>
        <div class="desc" id="descBox" hidden><h2 id="descTitle"></h2><p id="descText"></p><div class="amen" id="amen"></div></div>
        <div class="desc" id="availBox" hidden>
          <h2 id="availTitle"></h2>
          <p class="avail-sum" id="availSum"></p>
          <div class="cal-nav"><button type="button" id="calPrev" aria-label="Previous month">‹</button><button type="button" id="calNext" aria-label="Next month">›</button></div>
          <div class="cals" id="cals"></div>
          <div class="legend"><span><i class="dot busy"></i><span id="lgBusy"></span></span><span><i class="dot"></i><span id="lgFree"></span></span></div>
        </div>
      </div>
      <aside class="panel">
        <div class="badges" id="badges"></div>
        <div class="place" id="place"></div>
        <h1 id="title"></h1>
        <div class="price"><small id="priceLbl"></small><strong id="price"></strong></div>
        <div class="specs" id="specs"></div>
        <div id="ctaBox">
          <a class="cta" id="call" href="#" hidden></a>
          <a class="cta wa" id="wa" href="#" target="_blank" rel="noopener" hidden></a>
          <a class="cta" id="cta" href="seal.html#contact" hidden></a>
        </div>
      </aside>
    </div>
  </div>
</main>

<div class="lightbox" id="lb" hidden><button class="x" id="lbx" type="button" aria-label="Close">×</button><img id="lbImg" alt=""></div>

<script src="config.js"></script>
<script>
const T = {
  en:{back:'← Back to listings', load:'Loading...', nf:'Property not found.', err:'Could not load the property.', sale:'For sale', rent:'For rent', sold:'Sold', pool:'Pool',
      price:'Price', request:'Price on request', night:'per night / month', area:'Area', rooms:'Rooms', beds:'Bedrooms', baths:'Bathrooms', land:'Land area', floor:'Floor', code:'Code',
      avail:'Availability', free_now:'Available now', busy_now:'Currently booked · available from', free_next:'Available now · next booking from', lg_busy:'Booked', lg_free:'Available',
      desc:'Description', cta:'Contact us about this property', call:'Call', wa:'WhatsApp', region:'',
      garden:'Garden', wifi:'Wi-Fi', ac:'Air conditioning'},
  ka:{back:'← უკან ობიექტებზე', load:'იტვირთება...', nf:'ობიექტი ვერ მოიძებნა.', err:'ობიექტის ჩატვირთვა ვერ მოხერხდა.', sale:'იყიდება', rent:'ქირავდება', sold:'გაყიდულია', pool:'აუზი',
      price:'ფასი', request:'ფასი მოთხოვნით', night:'ფასი', area:'ფართი', rooms:'ოთახი', beds:'საძინებელი', baths:'სააბაზანო', land:'მიწის ფართი', floor:'სართული', code:'კოდი',
      avail:'თავისუფალი თარიღები', free_now:'ახლა თავისუფალია', busy_now:'ახლა დაკავებულია · თავისუფალია:', free_next:'ახლა თავისუფალია · შემდეგი დაკავება:', lg_busy:'დაკავებულია', lg_free:'თავისუფალია',
      desc:'აღწერა', cta:'დაგვიკავშირდით ამ ობიექტზე', call:'დარეკვა', wa:'WhatsApp', region:'',
      garden:'ბაღი', wifi:'Wi-Fi', ac:'კონდიციონერი'}
};
let lang = 'ka';
try { if (localStorage.getItem('lang') === 'en') lang = 'en'; } catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const usd = n => '$' + Number(n).toLocaleString('en-US');
const landFmt = s => lang === 'ka' ? String(s).replace('m²','მ²').replace('ha','ჰა') : s;
const q = new URLSearchParams(location.search);
const id = parseInt(q.get('id'), 10);
const backPage = q.get('kind') === 'rent' ? 'rent.html' : 'seal.html';


/* ქირაობის თარიღები (იგივე ლოგიკა, რაც data.js-ში) */
function isoDay(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(iso, n) { const p = iso.split('-').map(Number); return isoDay(new Date(p[0], p[1] - 1, p[2] + n)); }
function fmtDay(iso, lang) { const p = iso.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString(lang === 'ka' ? 'ka-GE' : 'en-GB', { day: 'numeric', month: 'short' }); }
function validBooked(b) { return (Array.isArray(b) ? b : []).filter(r => r && r.from && r.to && r.to >= r.from); }
/* აბრუნებს null-ს, თუ მომავალი დაკავება არ არის მითითებული;
   {busy:true, freeFrom} - ახლა დაკავებულია; {busy:false, nextBusy} - ახლა თავისუფალია */
function bookingInfo(booked) {
  const today = isoDay(new Date());
  const rs = validBooked(booked).filter(r => r.to >= today).map(r => ({ from: r.from, to: r.to })).sort((a, b) => a.from < b.from ? -1 : 1);
  const m = [];
  rs.forEach(r => { const l = m[m.length - 1]; if (l && r.from <= addDays(l.to, 1)) { if (r.to > l.to) l.to = r.to; } else m.push(r); });
  if (!m.length) return null;
  const cur = m.find(r => r.from <= today && today <= r.to);
  return cur ? { busy: true, freeFrom: addDays(cur.to, 1) } : { busy: false, nextBusy: m[0].from };
}

const _now = new Date();
let calY = _now.getFullYear(), calM = _now.getMonth();
const pad2 = n => String(n).padStart(2, '0');

function monthHTML(y, m, ranges) {
  const loc = lang === 'ka' ? 'ka-GE' : 'en-GB', today = isoDay(new Date());
  const title = new Date(y, m, 1).toLocaleDateString(loc, { month: 'long', year: 'numeric' });
  const wd = [0, 1, 2, 3, 4, 5, 6].map(i => new Date(2024, 0, 1 + i).toLocaleDateString(loc, { weekday: 'short' }));
  const first = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  let h = '<div class="cal"><h3>' + esc(title) + '</h3><div class="cal-grid">' + wd.map(w => '<span class="wd">' + esc(w) + '</span>').join('');
  for (let i = 0; i < first; i++) h += '<span></span>';
  for (let d = 1; d <= days; d++) {
    const iso = y + '-' + pad2(m + 1) + '-' + pad2(d);
    const cls = iso < today ? 'past' : (ranges.some(r => r.from <= iso && iso <= r.to) ? 'busy' : '');
    h += '<span class="d ' + cls + '">' + d + '</span>';
  }
  return h + '</div></div>';
}

function renderAvail() {
  const t = T[lang];
  const info = row && row.kind === 'rent' ? bookingInfo(row.booked) : null;
  $('availBox').hidden = !info;
  if (!info) return;
  const ranges = validBooked(row.booked);
  $('availTitle').textContent = t.avail;
  const sum = $('availSum');
  sum.className = 'avail-sum ' + (info.busy ? 'busy' : 'free');
  sum.textContent = info.busy ? t.busy_now + ' ' + fmtDay(info.freeFrom, lang)
                  : (info.nextBusy ? t.free_next + ' ' + fmtDay(info.nextBusy, lang) : t.free_now);
  $('lgBusy').textContent = t.lg_busy; $('lgFree').textContent = t.lg_free;
  const n = new Date(calY, calM + 1, 1);
  $('cals').innerHTML = monthHTML(calY, calM, ranges) + monthHTML(n.getFullYear(), n.getMonth(), ranges);
  $('calPrev').disabled = calY === _now.getFullYear() && calM === _now.getMonth();
}
function moveCal(k) {
  const d = new Date(calY, calM + k, 1);
  const limit = new Date(_now.getFullYear(), _now.getMonth() + 24, 1);
  if (d < new Date(_now.getFullYear(), _now.getMonth(), 1) || d > limit) return;
  calY = d.getFullYear(); calM = d.getMonth(); renderAvail();
}

let row = null, imgs = [], cur = 0;

function show(i) {
  if (!imgs.length) { $('galMain').hidden = false; $('mainImg').removeAttribute('src'); $('prev').hidden = $('next').hidden = true; $('counter').hidden = true; return; }
  cur = (i + imgs.length) % imgs.length;
  $('mainImg').src = imgs[cur];
  $('counter').textContent = (cur + 1) + ' / ' + imgs.length;
  $('prev').hidden = $('next').hidden = imgs.length < 2;
  $('counter').hidden = imgs.length < 2;
  document.querySelectorAll('#thumbs button').forEach((b, k) => b.classList.toggle('on', k === cur));
}

function render() {
  const t = T[lang], r = row;
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  $('back').textContent = t.back; $('back').href = backPage;
  $('cta').textContent = t.cta; $('cta').href = backPage + '#contact';
  if (!r) return;
  const ph = (r.phone || '').trim(), digits = ph.replace(/\D/g, '');
  $('call').hidden = $('wa').hidden = !digits; $('cta').hidden = !!digits;
  if (digits) { $('call').textContent = t.call + ': ' + ph; $('call').href = 'tel:' + (ph.charAt(0) === '+' ? '+' : '') + digits;
    $('wa').textContent = t.wa; $('wa').href = 'https://wa.me/' + digits; }
  const isSale = r.kind === 'sale';
  const name = lang === 'ka' ? (r.name_ka || r.name_en) : (r.name_en || r.name_ka);
  const place = lang === 'ka' ? (r.place_ka || r.place) : r.place;
  document.title = (name || '') + ' | PRIME PROPERTIES';
  $('title').textContent = name || '';
  $('place').textContent = place || '';
  $('badges').innerHTML = `<span class="badge ${r.sold ? 'sold' : ''}">${r.sold ? t.sold : (isSale ? t.sale : t.rent)}</span>` + (r.pool ? `<span class="badge">${t.pool}</span>` : '');

  const price = isSale ? r.price : (r.price_usd || r.price);
  $('priceLbl').textContent = t.price;
  $('price').textContent = price ? usd(price) : t.request;

  const specs = [[t.area, r.area ? Number(r.area).toLocaleString('en-US') + ' ' + (lang === 'ka' ? 'მ²' : 'm²') : ''],
                 [t.rooms, r.rooms], [t.beds, r.beds], [t.baths, isSale ? r.baths : ''],
                 [t.land, isSale && r.land ? landFmt(r.land) : ''], [t.floor, r.floor], [t.code, r.code]]
                .filter(s => s[1] !== '' && s[1] != null && s[1] !== 0);
  $('specs').innerHTML = specs.map(s => `<div><span>${esc(s[0])}</span><b>${esc(s[1])}</b></div>`).join('');

  const am = (r.amenities || []).filter(a => t[a]);
  $('descBox').hidden = !(r.description || r.description_en || am.length);
  $('descTitle').textContent = t.desc;
  $('descTitle').hidden = !(r.description || r.description_en);
  const desc = (lang === 'en' && r.description_en) ? r.description_en : (r.description || r.description_en || '');
  $('descText').textContent = desc;
  $('amen').innerHTML = am.map(a => `<span class="badge">${esc(t[a])}</span>`).join('');
  renderAvail();
}

async function load() {
  const t = T[lang];
  $('state').textContent = t.load;
  const ok = typeof SUPABASE_URL === 'string' && SUPABASE_URL.indexOf('YOUR-PROJECT') === -1 &&
             typeof SUPABASE_ANON_KEY === 'string' && SUPABASE_ANON_KEY.indexOf('YOUR-ANON') === -1;
  if (!id || !ok) { $('state').textContent = T[lang].nf; return; }
  try {
    const headers = { apikey: SUPABASE_ANON_KEY };
    if (SUPABASE_ANON_KEY.indexOf('eyJ') === 0) headers.Authorization = 'Bearer ' + SUPABASE_ANON_KEY;
    const res = await fetch(SUPABASE_URL + '/rest/v1/listings?select=*&published=eq.true&id=eq.' + id, { headers });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.length) { $('state').textContent = T[lang].nf; return; }
    row = data[0];
    imgs = (row.images && row.images.length ? row.images : (row.img ? [row.img] : [])).filter(Boolean);
    $('thumbs').innerHTML = imgs.length > 1 ? imgs.map((u, i) => `<button type="button" data-i="${i}"><img src="${esc(u)}" alt="" loading="lazy"></button>`).join('') : '';
    $('state').hidden = true; $('content').hidden = false;
    show(0); render();
  } catch (e) {
    console.error(e);
    $('state').textContent = T[lang].err;
  }
}

$('calPrev').addEventListener('click', () => moveCal(-1));
$('calNext').addEventListener('click', () => moveCal(1));
$('prev').addEventListener('click', () => show(cur - 1));
$('next').addEventListener('click', () => show(cur + 1));
$('thumbs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(+b.dataset.i); });
$('mainImg').addEventListener('click', () => { if (imgs.length) { $('lbImg').src = imgs[cur]; $('lb').hidden = false; } });
$('lb').addEventListener('click', e => { if (e.target !== $('lbImg')) $('lb').hidden = true; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('lb').hidden = true;
  if (!row) return;
  if (e.key === 'ArrowLeft') show(cur - 1);
  if (e.key === 'ArrowRight') show(cur + 1);
});
document.querySelector('.lang').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  lang = b.dataset.lang; try { localStorage.setItem('lang', lang); } catch (x) {}
  if (!row) $('state').textContent = T[lang].nf;
  render();
});

render();
load();
</script>
</body>
</html>
